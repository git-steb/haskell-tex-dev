name: build-and-publish

on:
  pull_request:
  push:
    branches: [main, "env/**"]
  workflow_dispatch:

permissions:
  contents: read

# Finish any in-flight release before starting another promotion.
concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test locally without registry credentials
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker build -f build_context/Dockerfile.base --build-arg VERSION="$version" -t env-base:test .
          docker build -f build_context/Dockerfile.haskell --build-arg BASE_IMAGE=env-base:test --build-arg VERSION="$version" -t env-haskell:test .
          docker build -f build_context/Dockerfile.tex --build-arg BASE_IMAGE=env-haskell:test --build-arg VERSION="$version" -t env-full:test .
          docker run --rm -i env-full:test bash < scripts/test-release-image.sh

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/git-steb/haskell-tex-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source build_context/versions.env
          [[ "$version" == "$VERSION" ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build base candidate
        id: base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build_context/Dockerfile.base
          build-args: |
            VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ env.IMAGE }}:base-${{ github.sha }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
          provenance: mode=max
          sbom: true
      - name: Build haskell candidate
        id: haskell
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build_context/Dockerfile.haskell
          build-args: |
            VERSION=${{ env.VERSION }}
            BASE_IMAGE=${{ env.IMAGE }}@${{ steps.base.outputs.digest }}
          push: true
          tags: ${{ env.IMAGE }}:haskell-${{ github.sha }}
          cache-from: type=gha,scope=haskell
          cache-to: type=gha,mode=max,scope=haskell
          provenance: mode=max
          sbom: true
      - name: Build tex candidate
        id: tex
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build_context/Dockerfile.tex
          build-args: |
            VERSION=${{ env.VERSION }}
            BASE_IMAGE=${{ env.IMAGE }}@${{ steps.haskell.outputs.digest }}
          push: true
          tags: ${{ env.IMAGE }}:tex-${{ github.sha }}
          cache-from: type=gha,scope=tex
          cache-to: type=gha,mode=max,scope=tex
          provenance: mode=max
          sbom: true
      - name: Test exact candidate digest
        env:
          DIGEST: ${{ steps.tex.outputs.digest }}
        run: docker run --rm -i "$IMAGE@$DIGEST" bash < scripts/test-release-image.sh
      - name: Promote tested digests
        if: github.ref == 'refs/heads/main'
        env:
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          HASKELL_DIGEST: ${{ steps.haskell.outputs.digest }}
          FULL_DIGEST: ${{ steps.tex.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:base-latest" "$IMAGE@$BASE_DIGEST"
          docker buildx imagetools create -t "$IMAGE:haskell-latest" "$IMAGE@$HASKELL_DIGEST"
          docker buildx imagetools create -t "$IMAGE:tex-latest" -t "$IMAGE:full-latest" -t "$IMAGE:latest" -t "$IMAGE:v$VERSION" "$IMAGE@$FULL_DIGEST"
          {
            echo "## Tested environment v$VERSION"
            echo "Commit: $GITHUB_SHA"
            echo "Image: $IMAGE@$FULL_DIGEST"
            echo "Release tag: $IMAGE:v$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
